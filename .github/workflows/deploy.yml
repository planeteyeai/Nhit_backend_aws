name: Deploy to AWS ECS

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger for testing

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: nhit-backend
  ECS_CLUSTER: nhit-cluster
  ECS_SERVICE: nhit-task-service-ep26xxoo
  CONTAINER_NAME: nhit-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Build and push Docker image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition nhit-task \
            --query taskDefinition > task-def-raw.json

          # Remove ONLY AWS-managed fields, keep everything else
          jq 'del(.compatibilities, .taskDefinitionArn, .requiresAttributes, .revision, .status, .registeredAt, .registeredBy, .enableFaultInjection, .deregisteredAt)' \
            task-def-raw.json > task-def.json

          echo "=== Current task definition summary ==="
          echo "Execution Role: $(jq -r '.executionRoleArn' task-def.json)"
          echo "Task Role: $(jq -r '.taskRoleArn' task-def.json)"
          echo "Secrets count: $(jq '.containerDefinitions[0].secrets // [] | length' task-def.json)"
          echo "Container image (before): $(jq -r '.containerDefinitions[0].image' task-def.json)"
          echo "Health check: $(jq -c '.containerDefinitions[0].healthCheck // null' task-def.json)"

      - name: Ensure JWT_SECRET in Secrets Manager + task definition
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          # Optional: set repo secret JWT_SECRET to reuse a known value; else we generate one.
          JWT_SECRET_INPUT: ${{ secrets.JWT_SECRET }}
        run: |
          set -euo pipefail
          NEW_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          MYSQL_FROM=$(jq -r '[.containerDefinitions[0].secrets // [] | .[] | select(.name=="MYSQL_HOST") | .valueFrom][0] // empty' task-def.json)
          if [ -z "$MYSQL_FROM" ]; then
            echo "::error::MYSQL_HOST secret mapping missing — cannot derive JWT_SECRET ARN."
            jq -c '.containerDefinitions[0].secrets // []' task-def.json
            exit 1
          fi

          # valueFrom looks like: arn:aws:secretsmanager:region:acct:secret:name:MYSQL_HOST::
          SECRET_ARN=$(echo "$MYSQL_FROM" | sed 's/:MYSQL_HOST::$//')
          JWT_FROM=$(echo "$MYSQL_FROM" | sed 's/:MYSQL_HOST::/:JWT_SECRET::/')
          echo "Secrets Manager ARN: $SECRET_ARN"
          echo "JWT valueFrom: $JWT_FROM"

          # Ensure the JSON secret actually contains key JWT_SECRET (otherwise ECS task won't start).
          RAW=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_ARN" \
            --region "$AWS_REGION" \
            --query SecretString \
            --output text)

          if ! echo "$RAW" | jq -e . >/dev/null 2>&1; then
            echo "::error::Secrets Manager value is not JSON key/value — cannot add JWT_SECRET key automatically."
            exit 1
          fi

          HAS_KEY=$(echo "$RAW" | jq -r 'if .JWT_SECRET and (.JWT_SECRET|tostring|length) > 0 then "yes" else "no" end')
          if [ "$HAS_KEY" = "no" ]; then
            if [ -n "${JWT_SECRET_INPUT:-}" ]; then
              NEW_JWT="$JWT_SECRET_INPUT"
              echo "Adding JWT_SECRET from GitHub Actions secret."
            else
              NEW_JWT=$(openssl rand -base64 32)
              echo "Generating new JWT_SECRET and writing to Secrets Manager."
            fi
            # Reject placeholders the app treats as weak.
            if echo "$NEW_JWT" | grep -Eiq 'change.?me|your.?jwt|placeholder|secret.?from.?production' || [ "${#NEW_JWT}" -lt 16 ]; then
              echo "::error::JWT_SECRET value is too weak/placeholder."
              exit 1
            fi
            MERGED=$(echo "$RAW" | jq --arg j "$NEW_JWT" '. + {JWT_SECRET: $j}')
            aws secretsmanager put-secret-value \
              --secret-id "$SECRET_ARN" \
              --secret-string "$MERGED" \
              --region "$AWS_REGION" >/dev/null
            echo "JWT_SECRET key written to Secrets Manager."
          else
            echo "JWT_SECRET key already exists in Secrets Manager."
          fi

          # Always ensure task definition maps JWT_SECRET (idempotent).
          jq --arg IMAGE "$NEW_IMAGE" --arg JWT_FROM "$JWT_FROM" '
            .containerDefinitions[0].image = $IMAGE
            | .containerDefinitions[0].secrets = (
                ((.containerDefinitions[0].secrets // []) | map(select(.name != "JWT_SECRET")))
                + [{name: "JWT_SECRET", valueFrom: $JWT_FROM}]
              )
          ' task-def.json > task-def-final.json

          echo "Secret names: $(jq -c '[.containerDefinitions[0].secrets // [] | .[].name]' task-def-final.json)"
          echo "Container image: $(jq -r '.containerDefinitions[0].image' task-def-final.json)"
          test "$(jq '[.containerDefinitions[0].secrets[] | select(.name=="JWT_SECRET")] | length' task-def-final.json)" -gt 0

      - name: Register new task definition
        run: |
          if ! aws ecs register-task-definition \
            --cli-input-json file://task-def-final.json \
            --region ${{ env.AWS_REGION }} > new-task-def.json 2>register-err.txt; then
            echo "::error::register-task-definition failed"
            cat register-err.txt
            jq 'keys' task-def-final.json || true
            exit 1
          fi

          NEW_TASK_DEF_ARN=$(jq -r '.taskDefinition.taskDefinitionArn' new-task-def.json)
          echo "New task definition: $NEW_TASK_DEF_ARN"
          echo "task-definition-arn=$NEW_TASK_DEF_ARN" >> $GITHUB_OUTPUT
        id: register-task-def

      - name: Update ECS service
        run: |
          # Circuit breaker off for this rollout so JWT mapping can land; grace covers cold start.
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition ${{ steps.register-task-def.outputs.task-definition-arn }} \
            --health-check-grace-period-seconds 300 \
            --deployment-configuration "deploymentCircuitBreaker={enable=false,rollback=false},maximumPercent=200,minimumHealthyPercent=50" \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }} > /dev/null

          echo "Service update initiated (grace=300s, circuit-breaker off)."
          echo "Events: https://console.aws.amazon.com/ecs/home?region=${{ env.AWS_REGION }}#/clusters/${{ env.ECS_CLUSTER }}/services/${{ env.ECS_SERVICE }}/events"
          echo "Logs: https://console.aws.amazon.com/cloudwatch/home?region=${{ env.AWS_REGION }}#logsV2:log-groups/log-group/%2Fecs%2Fnhit-backend"

      - name: Wait for service stability
        continue-on-error: true
        run: |
          set +e
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }}
          WAIT_RC=$?
          set -e

          echo "=== Recent service events ==="
          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].events[0:15].[createdAt,message]' \
            --output table

          if [ "$WAIT_RC" -ne 0 ]; then
            echo "::warning::Stability wait timed out — check /health jwtPresent after a few minutes."
            aws ecs list-tasks \
              --cluster ${{ env.ECS_CLUSTER }} \
              --service-name ${{ env.ECS_SERVICE }} \
              --region ${{ env.AWS_REGION }} \
              --desired-status STOPPED \
              --query 'taskArns[0:5]' \
              --output text | tr '\t' '\n' | while read -r TASK; do
                [ -z "$TASK" ] && continue
                DETAIL=$(aws ecs describe-tasks \
                  --cluster ${{ env.ECS_CLUSTER }} \
                  --tasks "$TASK" \
                  --region ${{ env.AWS_REGION }} \
                  --query 'tasks[0].{stoppedReason:stoppedReason,stopCode:stopCode,containers:containers[*].{name:name,reason:reason,exitCode:exitCode}}' \
                  --output json 2>/dev/null | jq -c . | head -c 900)
                echo "::warning title=Stopped task::${DETAIL}"
              done
            exit 0
          fi

          echo "ECS service is stable."
