name: Deploy to AWS ECS

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger for testing

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: nhit-backend
  ECS_CLUSTER: nhit-cluster
  ECS_SERVICE: nhit-task-service-ep26xxoo
  CONTAINER_NAME: nhit-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Build and push Docker image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition nhit-task \
            --query taskDefinition > task-def-raw.json

          # Remove ONLY AWS-managed fields, keep everything else
          jq 'del(.compatibilities, .taskDefinitionArn, .requiresAttributes, .revision, .status, .registeredAt, .registeredBy, .enableFaultInjection, .deregisteredAt)' \
            task-def-raw.json > task-def.json

          echo "=== Current task definition summary ==="
          echo "Execution Role: $(jq -r '.executionRoleArn' task-def.json)"
          echo "Task Role: $(jq -r '.taskRoleArn' task-def.json)"
          echo "Secrets count: $(jq '.containerDefinitions[0].secrets // [] | length' task-def.json)"
          echo "Container image (before): $(jq -r '.containerDefinitions[0].image' task-def.json)"
          echo "Health check: $(jq -c '.containerDefinitions[0].healthCheck // null' task-def.json)"

      - name: Update image in task definition
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Manually update ONLY the image using jq (same as last known-good deploy).
          NEW_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          jq --arg IMAGE "$NEW_IMAGE" \
            '.containerDefinitions[0].image = $IMAGE' \
            task-def.json > task-def-final.json

          echo "=== Updated task definition summary ==="
          echo "Execution Role: $(jq -r '.executionRoleArn' task-def-final.json)"
          echo "Task Role: $(jq -r '.taskRoleArn' task-def-final.json)"
          echo "Secrets count: $(jq '.containerDefinitions[0].secrets // [] | length' task-def-final.json)"
          echo "Container image (after): $(jq -r '.containerDefinitions[0].image' task-def-final.json)"

      - name: Register new task definition
        run: |
          if ! aws ecs register-task-definition \
            --cli-input-json file://task-def-final.json \
            --region ${{ env.AWS_REGION }} > new-task-def.json 2>register-err.txt; then
            echo "::error::register-task-definition failed"
            cat register-err.txt
            jq 'keys' task-def-final.json || true
            exit 1
          fi

          NEW_TASK_DEF_ARN=$(jq -r '.taskDefinition.taskDefinitionArn' new-task-def.json)
          echo "New task definition: $NEW_TASK_DEF_ARN"
          echo "task-definition-arn=$NEW_TASK_DEF_ARN" >> $GITHUB_OUTPUT
        id: register-task-def

      - name: Update ECS service
        run: |
          # Temporary: disable circuit-breaker rollback so a booting task is not
          # killed before /health can answer; grace period covers cold import.
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition ${{ steps.register-task-def.outputs.task-definition-arn }} \
            --health-check-grace-period-seconds 300 \
            --deployment-configuration "deploymentCircuitBreaker={enable=false,rollback=false},maximumPercent=200,minimumHealthyPercent=50" \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }} > /dev/null

          echo "Service update initiated (grace=300s, circuit-breaker off for this deploy)."
          echo "Events: https://console.aws.amazon.com/ecs/home?region=${{ env.AWS_REGION }}#/clusters/${{ env.ECS_CLUSTER }}/services/${{ env.ECS_SERVICE }}/events"
          echo "Logs: https://console.aws.amazon.com/cloudwatch/home?region=${{ env.AWS_REGION }}#logsV2:log-groups/log-group/%2Fecs%2Fnhit-backend"

      - name: Wait for service stability
        run: |
          set +e
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }}
          WAIT_RC=$?
          set -e

          echo "=== Recent service events ==="
          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].events[0:15].[createdAt,message]' \
            --output table

          if [ "$WAIT_RC" -ne 0 ]; then
            echo "::error::ECS service did not stabilize (circuit breaker / health check failure)."
            EVENTS=$(aws ecs describe-services \
              --cluster ${{ env.ECS_CLUSTER }} \
              --services ${{ env.ECS_SERVICE }} \
              --region ${{ env.AWS_REGION }} \
              --query 'services[0].events[0:8].message' \
              --output text 2>/dev/null | tr '\t' ' | ' | head -c 800)
            echo "::error::ECS events::${EVENTS}"

            aws ecs list-tasks \
              --cluster ${{ env.ECS_CLUSTER }} \
              --service-name ${{ env.ECS_SERVICE }} \
              --region ${{ env.AWS_REGION }} \
              --desired-status STOPPED \
              --query 'taskArns[0:5]' \
              --output text | tr '\t' '\n' | while read -r TASK; do
                [ -z "$TASK" ] && continue
                DETAIL=$(aws ecs describe-tasks \
                  --cluster ${{ env.ECS_CLUSTER }} \
                  --tasks "$TASK" \
                  --region ${{ env.AWS_REGION }} \
                  --query 'tasks[0].{stoppedReason:stoppedReason,stopCode:stopCode,containers:containers[*].{name:name,reason:reason,exitCode:exitCode}}' \
                  --output json 2>/dev/null | jq -c . | head -c 900)
                # Single-line annotation so GitHub API exposes the full reason.
                echo "::error title=Stopped task::${DETAIL}"
              done
            exit 1
          fi

          echo "ECS service is stable."
