name: Deploy to AWS ECS

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger for testing

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: nhit-backend
  ECS_CLUSTER: nhit-cluster
  ECS_SERVICE: nhit-task-service-ep26xxoo
  CONTAINER_NAME: nhit-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Build and push Docker image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition nhit-task \
            --query taskDefinition > task-def-raw.json
          
          # Remove ONLY AWS-managed fields, keep everything else
          jq 'del(.compatibilities, .taskDefinitionArn, .requiresAttributes, .revision, .status, .registeredAt, .registeredBy, .enableFaultInjection, .deregisteredAt)' \
            task-def-raw.json > task-def.json
          
          echo "=== Current task definition summary ==="
          echo "Execution Role: $(jq -r '.executionRoleArn' task-def.json)"
          echo "Task Role: $(jq -r '.taskRoleArn' task-def.json)"
          echo "Secrets count: $(jq '.containerDefinitions[0].secrets // [] | length' task-def.json)"
          echo "Container image (before): $(jq -r '.containerDefinitions[0].image' task-def.json)"

      - name: Update image in task definition
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Manually update ONLY the image using jq
          NEW_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          
          jq --arg IMAGE "$NEW_IMAGE" \
            '.containerDefinitions[0].image = $IMAGE' \
            task-def.json > task-def-updated.json
          
          echo "=== Updated task definition summary ==="
          echo "Execution Role: $(jq -r '.executionRoleArn' task-def-updated.json)"
          echo "Task Role: $(jq -r '.taskRoleArn' task-def-updated.json)"
          echo "Secrets count: $(jq '.containerDefinitions[0].secrets // [] | length' task-def-updated.json)"
          echo "Container image (after): $(jq -r '.containerDefinitions[0].image' task-def-updated.json)"
          
          # Save for deployment
          mv task-def-updated.json task-def-final.json

      - name: Register new task definition
        run: |
          aws ecs register-task-definition \
            --cli-input-json file://task-def-final.json \
            --region ${{ env.AWS_REGION }} > new-task-def.json
          
          NEW_TASK_DEF_ARN=$(jq -r '.taskDefinition.taskDefinitionArn' new-task-def.json)
          echo "New task definition: $NEW_TASK_DEF_ARN"
          echo "task-definition-arn=$NEW_TASK_DEF_ARN" >> $GITHUB_OUTPUT
        id: register-task-def

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition ${{ steps.register-task-def.outputs.task-definition-arn }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
          
          echo "Service update initiated"

      - name: Wait for service stability
        run: |
          echo "Waiting for service to become stable..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }}
          
          echo "✅ Service deployment completed successfully!"
