name: Deploy to AWS ECS

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger for testing

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: nhit-backend
  ECS_CLUSTER: nhit-cluster
  ECS_SERVICE: nhit-task-service-ep26xxoo
  CONTAINER_NAME: nhit-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Build and push Docker image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition nhit-task \
            --query taskDefinition > task-def-raw.json
          
          # Remove ONLY AWS-managed fields, keep secrets and environment
          jq 'del(.compatibilities, .taskDefinitionArn, .requiresAttributes, .revision, .status, .registeredAt, .registeredBy, .enableFaultInjection, .deregisteredAt)' \
            task-def-raw.json > task-def.json
          
          # Verify secrets are preserved
          echo "=== BEFORE image injection - secrets count ==="
          jq '.containerDefinitions[0].secrets // [] | length' task-def.json
          echo "=== Full secrets array ==="
          jq '.containerDefinitions[0].secrets // []' task-def.json
          echo "=== Environment vars count ==="
          jq '.containerDefinitions[0].environment // [] | length' task-def.json
          echo "=== Full environment array ==="
          jq '.containerDefinitions[0].environment // []' task-def.json

      - name: Inject new image into task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build.outputs.image }}

      - name: Verify secrets after image injection
        run: |
          echo "=== AFTER image injection - checking secrets ==="
          jq '.containerDefinitions[0].secrets // [] | length' ${{ steps.task-def.outputs.task-definition }}
          echo "=== Full secrets array ==="
          jq '.containerDefinitions[0].secrets // []' ${{ steps.task-def.outputs.task-definition }}
          echo "=== Environment vars ==="
          jq '.containerDefinitions[0].environment // []' ${{ steps.task-def.outputs.task-definition }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
